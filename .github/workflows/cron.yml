name: Market Cron

# DST note: each session moment has two cron entries (summer/winter UTC).
# Both fire year-round; KV 24h dedup blocks duplicate alerts in transition weeks.
#
# GPW: CET = UTC+1 (winter, Oct–Mar) | CEST = UTC+2 (summer, Mar–Oct)
# NYSE: EST = UTC-5 (winter, Nov–Mar) | EDT  = UTC-4 (summer, Mar–Nov)

on:
  schedule:
    # ── GPW opening  9:10 local ──────────────────────────────
    - cron: '10 7 * * 1-5'   # 9:10 CEST (summer)
    - cron: '10 8 * * 1-5'   # 9:10 CET  (winter)

    # ── GPW +30 min scalping  9:40 local ─────────────────────
    - cron: '40 7 * * 1-5'   # 9:40 CEST (summer)
    - cron: '40 8 * * 1-5'   # 9:40 CET  (winter)

    # ── GPW mid-day scalping  12:30 local ────────────────────
    - cron: '30 10 * * 1-5'  # 12:30 CEST (summer)
    - cron: '0 12 * * 1-5'   # 12:00 CET  (winter) — kept from original

    # ── GPW pre-close scalping  16:45 local ──────────────────
    - cron: '45 14 * * 1-5'  # 16:45 CEST (summer)
    - cron: '45 15 * * 1-5'  # 16:45 CET  (winter)

    # ── GPW power hour swing+aggressive  16:05 local ─────────
    - cron: '5 14 * * 1-5'   # 16:05 CEST (summer)  ← also NYSE +30min EDT
    - cron: '5 15 * * 1-5'   # 16:05 CET  (winter)  ← also NYSE +30min EST

    # ── GPW EOD swing+aggressive (full day candle) ────────────
    - cron: '35 15 * * 1-5'  # 17:35 CEST (summer, po zamknięciu) / 16:35 CET (winter)
    - cron: '40 15 * * 1-5'  # 17:40 CEST (summer) / 16:40 CET (winter)

    # ── NYSE opening  9:35 ET ────────────────────────────────
    - cron: '35 13 * * 1-5'  # 9:35 EDT (summer)
    - cron: '35 14 * * 1-5'  # 9:35 EST (winter)

    # ── NYSE +30 min scalping  10:05 ET ─────────────────────
    # reuses '5 14' (EDT) and '5 15' (EST) — same UTC slots as GPW power hour

    # ── NYSE mid-day scalping  12:30 ET ─────────────────────
    - cron: '30 16 * * 1-5'  # 12:30 EDT (summer)
    - cron: '35 17 * * 1-5'  # 12:35 EST (winter)

    # ── NYSE power hour  15:00 ET ───────────────────────────
    - cron: '0 19 * * 1-5'   # 15:00 EDT (summer)
    - cron: '0 20 * * 1-5'   # 15:00 EST (winter)

    # ── NYSE EOD  (kept from original) ───────────────────────
    - cron: '0 14 * * 1-5'   # NYSE scalping early (9:00 EST / 10:00 EDT)
    - cron: '35 19 * * 1-5'  # NYSE scalping
    - cron: '30 19 * * 1-5'  # NYSE aggressive pre-close
    - cron: '10 20 * * 1-5'  # NYSE swing + dividend
    - cron: '15 20 * * 1-5'  # NYSE aggressive

  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy (scalping|swing|aggressive|dividend|seasonality)'
        required: true
        default: 'scalping'
      exchange:
        description: 'Exchange (GPW|NYSE)'
        required: true
        default: 'GPW'
      slot:
        description: 'Slot (mid|pre — scalping only)'
        required: false
        default: ''

jobs:
  ping:
    name: Workflow triggered
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }} schedule=${{ github.event.schedule }} ref=${{ github.ref }}"

  fetch:
    name: Fetch market data
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE: https://gpw-analyzer.vercel.app/api/cron/fetch
      AUTH: ${{ secrets.CRON_SECRET }}

    steps:
      # ── Manual dispatch ──────────────────────────────────────
      - name: Manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          URL="${BASE}?strategy=${{ github.event.inputs.strategy }}&exchange=${{ github.event.inputs.exchange }}${SLOT:+&slot=$SLOT}"
          curl -sf --max-time 70 --retry 1 --retry-delay 10 "$URL" -H "Authorization: Bearer $AUTH"

      # ── GPW opening — all strategies ─────────────────────────
      - name: GPW opening — scalping
        if: github.event.schedule == '10 7 * * 1-5' || github.event.schedule == '10 8 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=GPW" -H "Authorization: Bearer $AUTH"

      - name: GPW opening — swing
        if: github.event.schedule == '10 7 * * 1-5' || github.event.schedule == '10 8 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=GPW" -H "Authorization: Bearer $AUTH"

      - name: GPW opening — aggressive
        if: github.event.schedule == '10 7 * * 1-5' || github.event.schedule == '10 8 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── GPW +30 min — scalping ───────────────────────────────
      - name: GPW +30min — scalping
        if: github.event.schedule == '40 7 * * 1-5' || github.event.schedule == '40 8 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── GPW mid-day — scalping ───────────────────────────────
      - name: GPW mid-day — scalping
        if: github.event.schedule == '30 10 * * 1-5' || github.event.schedule == '0 12 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&slot=mid&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── GPW pre-close — scalping ─────────────────────────────
      - name: GPW pre-close — scalping
        if: github.event.schedule == '45 14 * * 1-5' || github.event.schedule == '45 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&slot=pre&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── GPW power hour — swing + aggressive ─────────────────
      - name: GPW power hour — swing
        if: github.event.schedule == '5 14 * * 1-5' || github.event.schedule == '5 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=GPW" -H "Authorization: Bearer $AUTH"

      - name: GPW power hour — aggressive
        if: github.event.schedule == '5 14 * * 1-5' || github.event.schedule == '5 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── GPW EOD — swing + dividend + aggressive ──────────────
      - name: GPW EOD — swing
        if: github.event.schedule == '35 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=GPW" -H "Authorization: Bearer $AUTH"

      - name: GPW EOD — dividend
        if: github.event.schedule == '35 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=dividend&exchange=GPW" -H "Authorization: Bearer $AUTH"

      - name: GPW EOD — aggressive
        if: github.event.schedule == '40 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=GPW" -H "Authorization: Bearer $AUTH"

      # ── NYSE opening — all strategies ────────────────────────
      - name: NYSE opening — scalping
        if: github.event.schedule == '35 13 * * 1-5' || github.event.schedule == '35 14 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE opening — swing
        if: github.event.schedule == '35 13 * * 1-5' || github.event.schedule == '35 14 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE opening — aggressive
        if: github.event.schedule == '35 13 * * 1-5' || github.event.schedule == '35 14 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      # ── NYSE +30 min — scalping (reuses GPW power-hour slots) ─
      - name: NYSE +30min — scalping
        if: github.event.schedule == '5 14 * * 1-5' || github.event.schedule == '5 15 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      # ── NYSE mid-day — scalping ──────────────────────────────
      - name: NYSE mid-day — scalping
        if: github.event.schedule == '30 16 * * 1-5' || github.event.schedule == '35 17 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&slot=mid&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      # ── NYSE power hour — swing + aggressive ─────────────────
      - name: NYSE power hour — swing
        if: github.event.schedule == '0 19 * * 1-5' || github.event.schedule == '0 20 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE power hour — aggressive
        if: github.event.schedule == '0 19 * * 1-5' || github.event.schedule == '0 20 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      # ── NYSE legacy slots (kept for backward compat) ─────────
      - name: NYSE early — scalping
        if: github.event.schedule == '0 14 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE scalping
        if: github.event.schedule == '35 19 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=scalping&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE aggressive — pre-close
        if: github.event.schedule == '30 19 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE swing + dividend — EOD
        if: github.event.schedule == '10 20 * * 1-5'
        run: |
          curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=swing&exchange=NYSE" -H "Authorization: Bearer $AUTH"
          curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=dividend&exchange=NYSE" -H "Authorization: Bearer $AUTH"

      - name: NYSE aggressive — EOD
        if: github.event.schedule == '15 20 * * 1-5'
        run: curl -sf --max-time 70 --retry 1 --retry-delay 10 "$BASE?strategy=aggressive&exchange=NYSE" -H "Authorization: Bearer $AUTH"
