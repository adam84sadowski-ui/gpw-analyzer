name: Market Cron

# DST note: each session moment has two cron entries (summer/winter UTC).
# Both fire year-round; KV 24h dedup blocks duplicate alerts in transition weeks.
#
# GPW: CET = UTC+1 (winter, Oct–Mar) | CEST = UTC+2 (summer, Mar–Oct)
# NYSE: EST = UTC-5 (winter, Nov–Mar) | EDT  = UTC-4 (summer, Mar–Nov)
#
# GitHub Actions limit: max 20 unique cron expressions per workflow file.
# Current count: 20 — do not add more without removing one.

on:
  schedule:
    # ── GPW opening  9:10 local ──────────────────────────────  [1,2]
    - cron: '10 7 * * 1-5'   # 9:10 CEST (summer)
    - cron: '10 8 * * 1-5'   # 9:10 CET  (winter)

    # ── GPW +30 min scalping  9:40 local ─────────────────────  [3,4]
    - cron: '40 7 * * 1-5'   # 9:40 CEST (summer)
    - cron: '40 8 * * 1-5'   # 9:40 CET  (winter)

    # ── GPW mid-day scalping  12:30 local ────────────────────  [5,6]
    - cron: '30 10 * * 1-5'  # 12:30 CEST (summer)
    - cron: '0 12 * * 1-5'   # 12:00 CET  (winter)

    # ── GPW pre-close scalping  16:45 local ──────────────────  [7,8]
    - cron: '45 14 * * 1-5'  # 16:45 CEST (summer)
    - cron: '45 15 * * 1-5'  # 16:45 CET  (winter)

    # ── GPW power hour 16:05 + NYSE +30min 10:05 ─────────────  [9,10]
    - cron: '5 14 * * 1-5'   # 16:05 CEST / 10:05 EDT
    - cron: '5 15 * * 1-5'   # 16:05 CET  / 10:05 EST

    # ── GPW EOD ───────────────────────────────────────────────  [11,12]
    - cron: '35 15 * * 1-5'  # swing + dividend
    - cron: '40 15 * * 1-5'  # aggressive

    # ── NYSE opening  9:35 ET ────────────────────────────────  [13,14]
    - cron: '35 13 * * 1-5'  # 9:35 EDT (summer)
    - cron: '35 14 * * 1-5'  # 9:35 EST (winter)

    # ── NYSE mid-day  12:30 EDT ───────────────────────────────  [15]
    - cron: '30 16 * * 1-5'

    # ── NYSE power hour  15:00 ET ────────────────────────────  [16,17]
    - cron: '0 19 * * 1-5'   # 15:00 EDT (summer)
    - cron: '0 20 * * 1-5'   # 15:00 EST (winter)

    # ── NYSE EOD ──────────────────────────────────────────────  [18,19,20]
    - cron: '35 19 * * 1-5'
    - cron: '10 20 * * 1-5'
    - cron: '15 20 * * 1-5'

  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy (scalping|swing|aggressive|dividend)'
        required: true
        default: 'scalping'
      exchange:
        description: 'Exchange (GPW|NYSE)'
        required: true
        default: 'GPW'
      slot:
        description: 'Slot (mid|pre - scalping only)'
        required: false
        default: ''

jobs:
  fetch:
    name: Fetch market data
    runs-on: ubuntu-latest
    env:
      BASE: https://gpw-analyzer.vercel.app/api/cron/fetch
      AUTH: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Route by schedule or dispatch
        env:
          SCH: ${{ github.event.schedule }}
          STRATEGY: ${{ github.event.inputs.strategy }}
          EXCHANGE: ${{ github.event.inputs.exchange }}
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          c() {
            local P="strategy=$1&exchange=$2"
            [ -n "$3" ] && P="${P}&slot=$3"
            curl -sf --max-time 70 --retry 1 --retry-delay 10 \
              "${BASE}?${P}" -H "Authorization: Bearer $AUTH"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            c "$STRATEGY" "$EXCHANGE" "$SLOT"
            exit 0
          fi

          # GPW opening 9:10
          if   [ "$SCH" = "10 7 * * 1-5" ] || [ "$SCH" = "10 8 * * 1-5" ]; then
            c scalping GPW; c swing GPW; c aggressive GPW

          # GPW +30min scalping 9:40
          elif [ "$SCH" = "40 7 * * 1-5" ] || [ "$SCH" = "40 8 * * 1-5" ]; then
            c scalping GPW

          # GPW mid-day scalping 12:30
          elif [ "$SCH" = "30 10 * * 1-5" ] || [ "$SCH" = "0 12 * * 1-5" ]; then
            c scalping GPW mid

          # GPW pre-close scalping 16:45
          elif [ "$SCH" = "45 14 * * 1-5" ] || [ "$SCH" = "45 15 * * 1-5" ]; then
            c scalping GPW pre

          # GPW power hour 16:05 + NYSE +30min 10:05
          elif [ "$SCH" = "5 14 * * 1-5" ] || [ "$SCH" = "5 15 * * 1-5" ]; then
            c swing GPW; c aggressive GPW; c scalping NYSE

          # GPW EOD swing + dividend
          elif [ "$SCH" = "35 15 * * 1-5" ]; then
            c swing GPW; c dividend GPW

          # GPW EOD aggressive
          elif [ "$SCH" = "40 15 * * 1-5" ]; then
            c aggressive GPW

          # NYSE opening 9:35
          elif [ "$SCH" = "35 13 * * 1-5" ] || [ "$SCH" = "35 14 * * 1-5" ]; then
            c scalping NYSE; c swing NYSE; c aggressive NYSE

          # NYSE mid-day 12:30
          elif [ "$SCH" = "30 16 * * 1-5" ]; then
            c scalping NYSE mid

          # NYSE power hour 15:00
          elif [ "$SCH" = "0 19 * * 1-5" ] || [ "$SCH" = "0 20 * * 1-5" ]; then
            c swing NYSE; c aggressive NYSE

          # NYSE scalping EOD
          elif [ "$SCH" = "35 19 * * 1-5" ]; then
            c scalping NYSE

          # NYSE swing + dividend EOD
          elif [ "$SCH" = "10 20 * * 1-5" ]; then
            c swing NYSE; c dividend NYSE

          # NYSE aggressive EOD
          elif [ "$SCH" = "15 20 * * 1-5" ]; then
            c aggressive NYSE

          else
            echo "Unknown schedule: '$SCH' — skipping"
          fi
